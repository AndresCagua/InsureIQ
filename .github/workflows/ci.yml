name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen reproducible
        run: docker compose build python
      - name: Ejecutar diagnóstico
        run: docker compose run --rm python python -m insureiq.cli doctor
      - name: Ejecutar pruebas
        run: docker compose run --rm python pytest
      - name: Ejecutar lint
        run: docker compose run --rm python ruff check .
