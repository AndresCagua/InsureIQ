[project]
name = "insureiq"
version = "0.1.0"
description = "Insurance risk and fraud analytics platform"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "InsureIQ contributors" }]
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
ml = ["scikit-learn>=1.5,<2"]
quality = ["ruff>=0.6,<1", "pytest>=8.3,<9", "pytest-cov>=5,<6"]
notebooks = ["jupyterlab>=4.2,<5"]

[project.scripts]
insureiq-doctor = "insureiq.cli:doctor"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insureiq"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
